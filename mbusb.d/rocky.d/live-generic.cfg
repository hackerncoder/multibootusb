for isofile in $isopath/Rocky-*-Workstation-*.iso $isopath/Rocky-*-KDE-*.iso; do
  if [ -e "$isofile" ]; then
    regexp --set=isoname "$isopath/(.*)" "$isofile"
    submenu "$isoname ->" "$isofile" {
      iso_path="$2"
      _loopback loop "$iso_path"
      probe --label --set=cd_label (loop)
      menuentry "Start Rocky Linux Live" {
        bootoptions="iso-scan/filename=$iso_path root=live:CDLABEL=$cd_label rd.live.image rhgb quiet"
        linux (loop)/boot/x86_64/loader/linux $bootoptions
        initrd (loop)/boot/x86_64/loader/initrd
      }
      menuentry "Test this media & start Rocky Linux Live" {
        bootoptions="iso-scan/filename=$iso_path root=live:CDLABEL=$cd_label rd.live.image rhgb rd.live.check quiet"
        linux (loop)/boot/x86_64/loader/linux $bootoptions
        initrd (loop)/boot/x86_64/loader/initrd
      }
      menuentry "Start Rocky Linux Live in basic graphics mode" {
        bootoptions="iso-scan/filename=$iso_path root=live:CDLABEL=$cd_label rd.live.image rhgb nomodeset quiet"
        linux (loop)/boot/x86_64/loader/linux $bootoptions
        initrd (loop)/boot/x86_64/loader/initrd
      }
    }
  fi
done
